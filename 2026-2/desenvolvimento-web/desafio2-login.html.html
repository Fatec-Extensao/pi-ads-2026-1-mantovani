<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <form acion="/login" method="POST">

        <!-- Metodo POST é melhor que o GET, pois as informações não são visiveis na URL do site --> 
        <div>
        <label for="campo-email">E-mail</label>
            <input type="email" 
            id="campo-email"
            name="email"
            required
            autocomplete="email"
            placeholder="Digite seu e-mail">   
               
        </div>
        <label for="campo-senha">Senha</label>
        <input type="password"
        id="campo-senha"   
        name="senha"
        required
        autocomplete="current-password""
        placeholder="Digite sua senha">
        <div>


 <button type="submit"> Entrar</button>

     </div>

 <a href="/esqueci-senha"> 

    <div> Esqueci minha senha</a> </div>
 
    </form>
  </body>
</html>
