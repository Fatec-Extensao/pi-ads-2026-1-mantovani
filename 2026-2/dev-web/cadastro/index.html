<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Faça o pré cadastro de Web Control:
                                            A Conquista da Responsividade">
    <title>Pré Cadastro: Web Control: A conquista da Responsividade</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="https://www.postposmo.com/wp-content/uploads/2025/05/Gato-scaled-e1746733058951-840x560.jpg">
</head>
<body>
    <header>
        <img class="logo" src="https://tse1.mm.bing.net/th/id/OIP.fSD_DFslqYEpkcmT02-SmQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Web Control:
        A conquista da responsividade" width="400" height="120">
        <p class="chamada"> O novo jogo on-line em que cada fase acontece em uma
             tela diferente. Faça o pré-cadastro e garanta sua cópia antes do 
             lançamento</p>
    </header>
    <main>
        <form class="formulario" action="#" method="post" 
        aria-labelledby="titulo-formulario">
        <h1 class="titulo-formulario" id="titulo-formulario"> Pré-Cadastro</h1>
        <p class="instrucao">Campos marcados com <span class="obrigatorio" 
            aria-hidden="true">*</span>
            são obrigatórios</p>
    </form>
    <fieldset class="grupo">
        <legend class="grupo-titulo"> Seus Dados</legend>
        <div class="Campos">
         <div class="campo campo-largo">
            <label for="nome"> Nome Completo
                <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input type="text" id="nome" autocomplete="name" required>
         </div>   
         <div class="Campos">
            <label for="apelido"> Apelido no Jogo
                <span class="obrigatorio" aria-hidden="true">*</span>
                </label>
                <input type="text" id="apelido" autocomplete="nickname" pattern="[A-Za-z0-9]{3,16}"
                aria-describedby="dica-apelido erro-apelido" required>
                <p class="dica" id="dica-apelido">De 3 a 16 caracteres: letra sem acento, número e _</p>
                <p class="dica" id="erro-apelido"> O apelido não segue o formato pedido.</p>
         </div>       
        </div>    
        </div>
       </fieldset>
       
    </main>
</body>
</html>
